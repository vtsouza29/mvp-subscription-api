<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1300" viewBox="0 0 1300 1300">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
    <style>
      .t     { font-family: Helvetica, Arial, sans-serif; fill: #111827; }
      .title { font-size: 30px; font-weight: bold; }
      .sub   { font-size: 17px; fill: #4B5563; }
      .mod   { font-size: 23px; font-weight: bold; }
      .role  { font-size: 16px; fill: #4B5563; }
      .agg   { font-size: 15px; fill: #6B7280; font-style: italic; }
      .edge  { font-size: 15px; fill: #374151; font-weight: bold; }
      .edges { font-size: 14px; fill: #6B7280; }
      .db    { font-size: 15px; fill: #374151; }
      .badge { font-size: 12px; font-weight: bold; fill: #1D4ED8; }
      .leg   { font-size: 15px; fill: #374151; }
      .legt  { font-size: 16px; font-weight: bold; fill: #111827; }
      .note  { font-size: 14px; fill: #6B7280; }
    </style>
  </defs>

  <rect width="1300" height="1300" fill="#FFFFFF"/>

  <text class="t title" x="650" y="56"  text-anchor="middle">Arquitetura do MVP — controle de assinaturas digitais</text>
  <text class="t sub"   x="650" y="88"  text-anchor="middle">Cenário 2 · API principal + API secundária + API externa · comunicação REST</text>

  <!-- ===== API EXTERNA ===== -->
  <rect x="410" y="130" width="480" height="116" rx="10" fill="#D9E2F3" stroke="#2F5597" stroke-width="2.5"/>
  <text class="t mod"  x="650" y="170" text-anchor="middle">API Externa · Frankfurter</text>
  <text class="t role" x="650" y="197" text-anchor="middle">cotações de câmbio do Banco Central Europeu</text>
  <text class="t agg"  x="650" y="222" text-anchor="middle">pública · gratuita · sem cadastro e sem chave de API</text>

  <!-- principal -> externa -->
  <line x1="650" y1="392" x2="650" y2="252" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="t edge"  x="672" y="300">REST · GET /v1/latest</text>
  <text class="t edges" x="672" y="322">cotação consumida no servidor,</text>
  <text class="t edges" x="672" y="342">tratada e gravada como dado próprio</text>

  <!-- ===== COMPONENTE PRINCIPAL ===== -->
  <rect x="380" y="392" width="480" height="170" rx="10" fill="#FBE5D6" stroke="#2F5597" stroke-width="3"/>
  <rect x="398" y="408" width="68" height="22" rx="5" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.2"/>
  <text class="t badge" x="432" y="424" text-anchor="middle">docker</text>
  <text class="t mod"  x="620" y="462" text-anchor="middle">mvp-subscription-api</text>
  <text class="t role" x="620" y="489" text-anchor="middle">componente principal</text>
  <text class="t agg"  x="620" y="514" text-anchor="middle">agregado: Subscription</text>
  <text class="t agg"  x="620" y="538" text-anchor="middle">CRUD · normalização em BRL · desperdício</text>

  <!-- ===== COMPONENTE SECUNDARIA ===== -->
  <rect x="380" y="720" width="480" height="170" rx="10" fill="#FBE5D6" stroke="#2F5597" stroke-width="3"/>
  <rect x="398" y="736" width="68" height="22" rx="5" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.2"/>
  <text class="t badge" x="432" y="752" text-anchor="middle">docker</text>
  <text class="t mod"  x="620" y="790" text-anchor="middle">mvp-budget-api</text>
  <text class="t role" x="620" y="817" text-anchor="middle">componente secundária</text>
  <text class="t agg"  x="620" y="842" text-anchor="middle">agregado: Budget</text>
  <text class="t agg"  x="620" y="866" text-anchor="middle">metas · avaliação de estouro · projeção</text>

  <!-- principal -> secundaria -->
  <line x1="650" y1="566" x2="650" y2="716" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="t edge"  x="672" y="606">REST · X-API-Key própria</text>
  <text class="t edges" x="672" y="628">X-Request-ID propagado</text>
  <text class="t edges" x="672" y="648">timeout 3s + 1 retentativa</text>
  <text class="t edges" x="672" y="668">falha → degradação graciosa</text>

  <!-- ===== BANCOS ===== -->
  <g stroke="#2F5597" stroke-width="2" fill="#EFF3FB">
    <ellipse cx="176" cy="437" rx="72" ry="18"/>
    <path d="M 104 437 L 104 515 A 72 18 0 0 0 248 515 L 248 437"/>
    <ellipse cx="176" cy="765" rx="72" ry="18"/>
    <path d="M 104 765 L 104 843 A 72 18 0 0 0 248 843 L 248 765"/>
  </g>
  <text class="t db" x="176" y="481" text-anchor="middle">SQLite</text>
  <text class="t db" x="176" y="503" text-anchor="middle">subscriptions</text>
  <text class="t db" x="176" y="809" text-anchor="middle">SQLite</text>
  <text class="t db" x="176" y="831" text-anchor="middle">budgets</text>
  <line x1="376" y1="477" x2="252" y2="477" stroke="#374151" stroke-width="2.5"/>
  <line x1="376" y1="805" x2="252" y2="805" stroke="#374151" stroke-width="2.5"/>

  <!-- ===== REDIS ===== -->
  <rect x="960" y="586" width="260" height="110" rx="10" fill="#EFF3FB" stroke="#6B7280" stroke-width="2" stroke-dasharray="7 4"/>
  <text class="t mod"  x="1090" y="624" text-anchor="middle" font-size="21">Redis</text>
  <text class="t role" x="1090" y="650" text-anchor="middle">cache compartilhado</text>
  <text class="t agg"  x="1090" y="675" text-anchor="middle">opcional · fallback em memória</text>

  <path d="M 864 500 L 912 500 L 912 616 L 956 616" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrowDash)"/>
  <path d="M 864 828 L 912 828 L 912 666 L 956 666" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrowDash)"/>
  <text class="t edges" x="924" y="492">fx:latest · fx:fallback</text>
  <text class="t edges" x="924" y="838">evaluation · projection</text>

  <!-- ===== LEGENDA ===== -->
  <rect x="80" y="960" width="1140" height="150" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
  <text class="t legt" x="106" y="992">Legenda</text>

  <rect x="106" y="1014" width="30" height="18" rx="3" fill="#FBE5D6" stroke="#2F5597" stroke-width="2"/>
  <text class="t leg" x="150" y="1028">módulo implementado — repositório, banco e Dockerfile próprios</text>

  <rect x="106" y="1058" width="30" height="18" rx="3" fill="#D9E2F3" stroke="#2F5597" stroke-width="2"/>
  <text class="t leg" x="150" y="1072">módulo externo, apenas consumido</text>

  <line x1="700" y1="1023" x2="758" y2="1023" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="t leg" x="776" y="1028">comunicação obrigatória</text>

  <line x1="700" y1="1067" x2="758" y2="1067" stroke="#6B7280" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrowDash)"/>
  <text class="t leg" x="776" y="1072">comunicação opcional</text>

  <text class="t note" x="650" y="1170" text-anchor="middle">Cada componente implementada tem repositório público, banco e Dockerfile próprios.</text>
  <text class="t note" x="650" y="1194" text-anchor="middle">A orquestração dos três containers é feita por docker compose, na raiz do repositório da componente principal.</text>
  <text class="t note" x="650" y="1218" text-anchor="middle">O consumo da API externa acontece no servidor: em nenhum momento o usuário é redirecionado para ela.</text>
</svg>
